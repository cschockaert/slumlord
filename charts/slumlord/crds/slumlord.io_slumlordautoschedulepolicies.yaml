    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: SlumlordAutoSchedulePolicy is the Schema for the slumlordautoschedulepolicies
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SlumlordAutoSchedulePolicySpec defines the desired state
              of SlumlordAutoSchedulePolicy.
            properties:
              generatedName:
                description: |-
                  GeneratedName is the name of the SlumlordSleepSchedule created in each
                  matched namespace. Defaults to "auto-sleep". Must be a valid DNS-1123
                  subdomain.
                type: string
              namespaceSelector:
                description: |-
                  NamespaceSelector restricts which namespaces this policy applies to.
                  If empty, defaults to: matchExpressions: [{key: <profileLabel>, operator: Exists}]
                  so only namespaces explicitly carrying the profile label are matched.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              profileLabel:
                description: |-
                  ProfileLabel is the namespace label whose value selects a profile from
                  spec.profiles. Defaults to "slumlord.io/sleep-profile".
                type: string
              profiles:
                additionalProperties:
                  description: |-
                    AutoScheduleProfile is the template used to materialize a SleepSchedule.
                    It mirrors the user-facing fields of SlumlordSleepScheduleSpec.
                  properties:
                    schedules:
                      description: |-
                        Schedules defines one or more sleep windows. Workloads sleep if ANY
                        window matches the current time.
                      items:
                        description: SleepWindow defines the time window for sleeping
                        properties:
                          days:
                            description: |-
                              Days specifies which days the schedule applies (0=Sunday, 6=Saturday)
                              If empty, applies every day
                            items:
                              type: integer
                            maxItems: 7
                            type: array
                          end:
                            description: End is the time to wake up (cron format for
                              time, e.g., "06:00")
                            pattern: ^([01]?[0-9]|2[0-3]):[0-5][0-9]$
                            type: string
                          start:
                            description: Start is the time to start sleeping (cron
                              format for time, e.g., "22:00")
                            pattern: ^([01]?[0-9]|2[0-3]):[0-5][0-9]$
                            type: string
                          timezone:
                            description: |-
                              Timezone is the timezone for the schedule (e.g., "Europe/Paris", "UTC")
                              Defaults to UTC if not specified.
                            type: string
                        required:
                        - end
                        - start
                        type: object
                      minItems: 1
                      type: array
                    selector:
                      description: Selector specifies which workloads to target in
                        each matched namespace.
                      properties:
                        matchLabels:
                          additionalProperties:
                            type: string
                          description: MatchLabels selects workloads by labels
                          type: object
                        matchNames:
                          description: MatchNames selects workloads by name (supports
                            wildcards)
                          items:
                            type: string
                          type: array
                        types:
                          description: |-
                            Types specifies which workload types to target
                            Valid values: Deployment, StatefulSet, CronJob, Cluster, HelmRelease, Kustomization, ThanosRuler, Alertmanager, Prometheus, MariaDB, MaxScale, Elasticsearch, Kibana
                          items:
                            type: string
                          type: array
                      type: object
                    suspend:
                      description: Suspend is forwarded onto every generated SleepSchedule
                        when true.
                      type: boolean
                  required:
                  - schedules
                  - selector
                  type: object
                description: |-
                  Profiles is a map of profile name -> SleepSchedule template. A namespace
                  is auto-scheduled by setting the profile label to one of these keys.
                minProperties: 1
                type: object
              reconcileInterval:
                description: ReconcileInterval overrides the default reconciliation
                  interval.
                type: string
              suspend:
                description: |-
                  Suspend pauses reconciliation when true. Existing generated schedules
                  remain in place but are no longer kept in sync with the policy template.
                type: boolean
            required:
            - profiles
            type: object
          status:
            description: SlumlordAutoSchedulePolicyStatus reports policy-level reconciliation
              health.
            properties:
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              conflicts:
                description: |-
                  Conflicts lists namespaces where this policy would generate a schedule
                  but another policy already matches the same namespace, or where a
                  non-managed SleepSchedule with the same name already exists.
                items:
                  description: NamespaceConflict describes why a namespace was skipped.
                  properties:
                    message:
                      description: Message is a human-readable explanation.
                      type: string
                    namespace:
                      description: Namespace whose reconciliation was skipped.
                      type: string
                    reason:
                      description: Reason machine-readable code (e.g. PolicyOverlap,
                        ManualScheduleExists).
                      type: string
                    withPolicies:
                      description: |-
                        WithPolicies lists the other policies that also match this namespace,
                        when Reason == PolicyOverlap.
                      items:
                        type: string
                      type: array
                  required:
                  - namespace
                  - reason
                  type: object
                type: array
              generatedSchedules:
                description: |-
                  GeneratedSchedules is the count of SleepSchedules currently owned by
                  this policy (managed-by label points back at the policy).
                format: int32
                type: integer
              matchedNamespaces:
                description: |-
                  MatchedNamespaces is the count of namespaces this policy matched at the
                  last reconcile.
                format: int32
                type: integer
              missingProfiles:
                description: |-
                  MissingProfiles lists namespaces whose profile label value does not
                  match any of the profiles declared in spec.profiles.
                items:
                  description: MissingProfile describes a namespace whose label points
                    at an undefined profile.
                  properties:
                    namespace:
                      description: Namespace whose reconciliation was skipped.
                      type: string
                    profile:
                      description: Profile is the label value that did not match any
                        declared profile.
                      type: string
                  required:
                  - namespace
                  - profile
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration reflects the generation most recently
                  reconciled.
                format: int64
                type: integer
            type: object
        type: object
